plugins {
    id 'com.android.library'
}

// Keep in sync with addons/outtap_ads/export_plugin.gd (the app pulls these at export time).
def GMA_VERSION = "25.5.0"
def UMP_VERSION = "4.0.0"

android {
    namespace 'com.namslab.outtap.ads'
    compileSdk 36
    defaultConfig {
        minSdk 24
        buildConfigField "String", "GMA_VERSION", "\"${GMA_VERSION}\""
        buildConfigField "String", "UMP_VERSION", "\"${UMP_VERSION}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Godot engine classes (GodotPlugin, SignalInfo, UsedByGodot) from the installed 4.7.2 build
    // template; tools/build_android_plugin.sh extracts this jar. Provided by the app at runtime.
    compileOnly files("../libs/godot-lib-4.7.2-classes.jar")
    compileOnly "com.google.android.gms:play-services-ads:${GMA_VERSION}"
    compileOnly "com.google.android.ump:user-messaging-platform:${UMP_VERSION}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}
